name: restricted-zone-monitor
description: >
  Monitor a small facility for people entering the restricted loading zone. Critical events must be
  detected reliably and alerted quickly; the system must keep working through WAN loss. Cloud
  confirmation (precision), historical indexing and background-stream fidelity may be sacrificed.

invariants:
  - metric: critical_event_recall
    min: 0.95
    description: fraction of ground-truth restricted-zone entries that produced an alert
  - metric: alert_latency_p95_ms
    max: 2000
    description: p95 of wall-clock time from first in-zone frame to alert

objectives:
  - metric: alert_precision
    direction: maximize
    weight: 2.0
  - metric: cloud_bytes_total
    direction: minimize
    weight: 1.0
  - metric: cpu_percent_mean
    direction: minimize
    weight: 1.0

priorities:
  critical_detection: 100
  emergency_alerting: 100
  cloud_confirmation: 50
  historical_indexing: 20
  background_streams: 10

degradable_capabilities:
  - cloud_confirmation
  - historical_indexing
  - background_stream_fps
  - background_stream_count
  - detector_resolution

survivability:
  wan_outage: required
