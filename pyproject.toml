[project]
name = "failsafe"
version = "0.1.0"
description = "Failsafe: a resilience compiler for edge / Physical-AI systems. Discovers, verifies and compiles degraded operating modes."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.9",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "ultralytics>=8.3",
    "psutil>=6.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "requests>=2.32",
    "openai>=3.5.0",
    "huggingface-hub>=1.30.0",
    "remotezip>=0.12.6",
    "datasets>=5.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-timeout>=2.3", "ruff>=0.6"]
llm = ["openai>=1.40"]

[project.scripts]
failsafe = "failsafe.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["failsafe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
