<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#7c848d"/></marker><marker id="ahg" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#5c8f00"/></marker><marker id="aha" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#e8862a"/></marker><filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0b132010" flood-opacity="0.18"/></filter></defs>
<rect x="0" y="0" width="1100" height="620" rx="0" fill="#ffffff"/>
<text x="550.0" y="52" font-size="24" font-weight="800" fill="#1b2430" text-anchor="middle">Why you can trust the agent</text>
<text x="550.0" y="80" font-size="14.5" font-weight="400" fill="#5b6670" text-anchor="middle">the LLM never decides what a failing system does — measurement does</text>
<rect x="150" y="130" width="800" height="96" rx="12" fill="#eef7dd" stroke="#9fce4e" stroke-width="2"/>
<text x="174" y="168" font-size="17" font-weight="800" fill="#5c8f00" text-anchor="start">AI  ·  proposes</text>
<text x="174" y="192" font-size="12.5" font-weight="400" fill="#5b6670" text-anchor="start">Nemotron compiles missions and proposes candidate degraded modes; grid / random / greedy also propose</text>
<rect x="800" y="164" width="128" height="30" rx="15.0" fill="#eef7dd" stroke="#76b900" stroke-width="1.4"/>
<text x="864.0" y="183.5" font-size="12" font-weight="700" fill="#5c8f00" text-anchor="middle">LLM allowed</text>
<line x1="120" y1="239.0" x2="980" y2="239.0" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="2 4"/>
<rect x="150" y="252" width="800" height="96" rx="12" fill="#76b900" filter="url(#soft)"/>
<text x="174" y="290" font-size="17" font-weight="800" fill="#ffffff" text-anchor="start">Deterministic evaluator  ·  verifies</text>
<text x="174" y="314" font-size="12.5" font-weight="400" fill="#eaf5d3" text-anchor="start">measured metrics checked against the mission invariants  →  PASS / FAIL. A missing or unavailable metric FAILS.</text>
<line x1="120" y1="361.0" x2="980" y2="361.0" stroke="#e8862a" stroke-width="2.4"/>
<text x="984" y="365.0" font-size="12" font-weight="800" fill="#e8862a" text-anchor="start">no LLM</text>
<text x="984" y="380.0" font-size="12" font-weight="800" fill="#e8862a" text-anchor="start">below</text>
<rect x="150" y="374" width="800" height="96" rx="12" fill="#1b2430" filter="url(#soft)"/>
<text x="174" y="412" font-size="17" font-weight="800" fill="#ffffff" text-anchor="start">Deterministic runtime  ·  decides</text>
<text x="174" y="436" font-size="12.5" font-weight="400" fill="#c7ced6" text-anchor="start">compiled-policy lookup only; activates a verified mode, or reports NO VERIFIED MODE and fails closed</text>
<rect x="782" y="408" width="146" height="30" rx="15.0" fill="#2b3644"/>
<text x="855.0" y="427.5" font-size="11.5" font-weight="700" fill="#9fce4e" text-anchor="middle">on-device · offline-safe</text>
<text transform="rotate(-90 90 300.0)" x="90" y="300.0" font-size="12" font-weight="700" fill="#5b6670" text-anchor="middle">compile-time</text>
<text transform="rotate(-90 90 422.0)" x="90" y="422.0" font-size="12" font-weight="700" fill="#5b6670" text-anchor="middle">run-time</text>
</svg>