<rect x="48" y="786" width="640" height="144" rx="10" fill="#0f1720"/>
<text x="64" y="810" font-size="11" font-weight="700" fill="#7fd0ff" text-anchor="start">resilience-policy.yaml  (excerpt, compiled from measured runs)</text>
<text x="64" y="832" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#cfe3f2">modes:</text>
<text x="64" y="849" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#cfe3f2">  island:            # verified for wan_offline</text>
<text x="64" y="866" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#cfe3f2">    cloud_confirmation: false     recall: 0.965  p95_ms: 970</text>
<text x="64" y="883" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#cfe3f2">  zombie-cloud:      # verified for wan_zombie</text>
<text x="64" y="900" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#cfe3f2">    cloud_timeout_ms: 1000        recall: 0.982  p95_ms: 1583</text>
<text x="64" y="917" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#cfe3f2">unverified: [compute_severe]      # → fail closed</text>
<text x="720" y="800" font-size="14" font-weight="800" fill="#1b2430" text-anchor="start">How the loop runs</text>
<circle cx="732.0" cy="828" r="11.5" fill="#ffffff" stroke="#5b6670" stroke-width="1.6" filter="url(#soft)"/>
<text x="732.0" y="832.2" font-size="11.5" font-weight="800" fill="#5b6670" text-anchor="middle">1</text>
<text x="752.0" y="832" font-size="11.8" font-weight="400" fill="#1b2430" text-anchor="start">Strategies propose candidate operating configurations from a bounded space.</text>
<circle cx="732.0" cy="862" r="11.5" fill="#ffffff" stroke="#5b6670" stroke-width="1.6" filter="url(#soft)"/>
<text x="732.0" y="866.2" font-size="11.5" font-weight="800" fill="#5b6670" text-anchor="middle">2</text>
<text x="752.0" y="866" font-size="11.8" font-weight="400" fill="#1b2430" text-anchor="start">Each is run under injected faults — slow/zombie/offline cloud, bandwidth, compute.</text>
<circle cx="732.0" cy="896" r="11.5" fill="#ffffff" stroke="#5b6670" stroke-width="1.6" filter="url(#soft)"/>
<text x="732.0" y="900.2" font-size="11.5" font-weight="800" fill="#5b6670" text-anchor="middle">3</text>
<text x="752.0" y="900" font-size="11.8" font-weight="400" fill="#1b2430" text-anchor="start">The runner replays the corpus in real time and measures recall, latency, drops, CPU.</text>
<circle cx="732.0" cy="930" r="11.5" fill="#ffffff" stroke="#5b6670" stroke-width="1.6" filter="url(#soft)"/>
<text x="732.0" y="934.2" font-size="11.5" font-weight="800" fill="#5b6670" text-anchor="middle">4</text>
<text x="752.0" y="934" font-size="11.8" font-weight="400" fill="#1b2430" text-anchor="start">The deterministic evaluator checks the measured metrics against the invariants.</text>
<circle cx="732.0" cy="964" r="11.5" fill="#ffffff" stroke="#5b6670" stroke-width="1.6" filter="url(#soft)"/>
<text x="732.0" y="968.2" font-size="11.5" font-weight="800" fill="#5b6670" text-anchor="middle">5</text>
<text x="752.0" y="968" font-size="11.8" font-weight="400" fill="#1b2430" text-anchor="start">Verified modes are compiled into the policy, each linked to its experiment.</text>
<circle cx="732.0" cy="998" r="11.5" fill="#ffffff" stroke="#5b6670" stroke-width="1.6" filter="url(#soft)"/>
<text x="732.0" y="1002.2" font-size="11.5" font-weight="800" fill="#5b6670" text-anchor="middle">6</text>
<text x="752.0" y="1002" font-size="11.8" font-weight="400" fill="#1b2430" text-anchor="start">At runtime the device observes conditions and looks up a verified mode.</text>
<circle cx="732.0" cy="1032" r="11.5" fill="#ffffff" stroke="#e8862a" stroke-width="1.6" filter="url(#soft)"/>
<text x="732.0" y="1036.2" font-size="11.5" font-weight="800" fill="#e8862a" text-anchor="middle">7</text>
<text x="752.0" y="1036" font-size="11.8" font-weight="400" fill="#1b2430" text-anchor="start">If none fits, it fails closed — NO VERIFIED MODE — and escalates. Never a guess.</text>
<text x="48" y="1094" font-size="11" font-weight="400" fill="#9aa2ab" text-anchor="start">NVIDIA Nemotron via Nebius Token Factory / NVIDIA Build; NVIDIA marks used only to identify sponsor technology.</text>
</svg>