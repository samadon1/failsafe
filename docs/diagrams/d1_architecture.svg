<rect x="0" y="0" width="1460" height="1120" rx="0" fill="#ffffff"/>
<text x="48" y="52" font-size="25" font-weight="800" fill="#1b2430" text-anchor="start">How Failsafe compiles and runs resilience</text>
<text x="48" y="80" font-size="12.5" font-weight="400" fill="#5b6670" text-anchor="start">Given an app and its mission invariants, Failsafe searches how the system should degrade when the cloud, network or compute fail,</text>
<text x="48" y="99" font-size="12.5" font-weight="400" fill="#5b6670" text-anchor="start">verifies every candidate with a deterministic evaluator, and compiles only the verified modes into a runtime policy. The runtime is a</text>
<text x="48" y="118" font-size="12.5" font-weight="400" fill="#5b6670" text-anchor="start">plain lookup — no model runs while the system is failing — and if no verified mode fits the moment, it fails closed and says so.</text>
